[project]
name = "web-ai-chatbot"
version = "0.1.0"
description = "FastAPI 웹 AI 챗봇 서비스 (Codyssey B7-1 팀 프로젝트)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
