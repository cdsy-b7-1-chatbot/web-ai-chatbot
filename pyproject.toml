[project]
name = "web-ai-chatbot"
version = "0.1.0"
description = "FastAPI 웹 AI 챗봇 서비스 (Codyssey B7-1 팀 프로젝트)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E·W 코드 모양, F 버그 가능성, I import 순서, N 이름 규칙(PEP 8), UP 최신 문법, B 흔한 실수
select = ["E", "W", "F", "I", "N", "UP", "B"]
# 줄 길이는 포매터가 맞춘다. 한글은 폭 2칸으로 세어져 주석이 과하게 걸리므로 린트에서는 뺀다.
ignore = ["E501"]
